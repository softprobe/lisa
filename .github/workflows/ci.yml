name: Lisa CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python unit and transient Postgres integration tests
        run: |
          uv sync --extra test
          uv run --extra test pytest -q tests
      - name: Lisa app frontend
        run: |
          npm ci --prefix frontend
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Verify standalone Docker image
        run: docker build --tag softprobe/lisa:ci .
