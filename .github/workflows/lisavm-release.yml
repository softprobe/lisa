name: lisavm Release

on:
  push:
    tags:
      - 'lisavm-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: lisavm/go.mod
      - name: Build static lisavm binary (${{ matrix.arch }})
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SKIP_ROOTFS: "1"
          OUT_DIR: ${{ github.workspace }}/dist
        run: ./deploy/firecracker/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lisavm-bin-${{ matrix.arch }}
          path: dist/lisavm-linux-${{ matrix.arch }}

  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs zstd
      - name: Build golden rootfs.ext4
        run: sudo ROOTFS_OUT=/tmp/rootfs.ext4 ./deploy/firecracker/build-rootfs.sh
      - name: Compress rootfs.ext4
        run: |
          mkdir -p dist
          zstd -T0 -q -f -o dist/rootfs-amd64.ext4.zst /tmp/rootfs.ext4
      - uses: actions/upload-artifact@v4
        with:
          name: lisavm-rootfs-amd64
          path: dist/rootfs-amd64.ext4.zst

  release:
    needs: [build-binaries, build-rootfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Copy host setup files and compute SHA256SUMS
        run: |
          cp deploy/firecracker/setup-kvm-host.sh release-artifacts/setup-kvm-host.sh
          cp deploy/firecracker/lisavm-network.sh release-artifacts/lisavm-network.sh
          cp deploy/firecracker/templates/lisavm-network.service release-artifacts/lisavm-network.service
          chmod 0755 release-artifacts/setup-kvm-host.sh release-artifacts/lisavm-network.sh
          chmod 0644 release-artifacts/lisavm-network.service
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lisavm-release-bundle
          path: release-artifacts/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/lisavm-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            gh release create "${TAG}" release-artifacts/* \
              --title "lisavm ${TAG}" \
              --generate-notes
          fi
