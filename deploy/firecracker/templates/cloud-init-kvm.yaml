#cloud-config
package_update: true
packages:
  - curl
  - jq
  - iproute2
  - iptables
  - python3
  - zstd
  - gzip
  - ca-certificates

write_files:
  - path: /etc/lisavm/lisavm.env
    permissions: "0600"
    owner: root:root
    content: |
      LISAVM_LISTEN_ADDR=127.0.0.1:7700
      LISAVM_API_TOKEN=change-me
      LISAVM_ROOT=/var/lib/lisavm
      LISAVM_BRIDGE=lisabr0
      LISAVM_GATEWAY_IP=172.16.0.1
      LISAVM_VCPU_COUNT=1
      LISAVM_MEM_SIZE_MIB=1024

  - path: /etc/systemd/system/lisavm-network.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Lisa Firecracker Bridge and NAT Networking
      After=network-online.target docker.service
      Wants=network-online.target
      Before=lisavm.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=-/etc/lisavm/lisavm.env
      ExecStart=/usr/local/bin/lisavm-network

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/lisavm.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Lisa Firecracker MicroVM Control Plane
      After=network-online.target lisavm-network.service
      Wants=network-online.target
      Requires=lisavm-network.service

      [Service]
      Type=simple
      EnvironmentFile=/etc/lisavm/lisavm.env
      ExecStart=/usr/local/bin/lisavm
      Restart=on-failure
      RestartSec=3
      LimitNOFILE=65536
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

runcmd:
  - |
    set -euo pipefail
    RELEASE_REPO="${LISAVM_RELEASE_REPO:-softprobe/lisa}"
    RELEASE_TAG="${LISAVM_RELEASE_TAG:-latest}"
    case "$(uname -m)" in
      x86_64) ARCH="amd64" ;;
      *) echo "unsupported arch: $(uname -m) (only x86_64/amd64 is supported)" >&2; exit 1 ;;
    esac

    if [ "${RELEASE_TAG}" = "latest" ]; then
      BASE_URL="https://github.com/${RELEASE_REPO}/releases/latest/download"
    else
      BASE_URL="https://github.com/${RELEASE_REPO}/releases/download/${RELEASE_TAG}"
    fi

    WORKDIR="$(mktemp -d)"
    trap 'rm -rf "${WORKDIR}"' EXIT

    for artifact in \
      SHA256SUMS \
      "lisavm-linux-${ARCH}" \
      "rootfs-${ARCH}.ext4.zst" \
      setup-kvm-host.sh \
      lisavm-network.sh \
      lisavm-network.service; do
      curl -fsSL "${BASE_URL}/${artifact}" -o "${WORKDIR}/${artifact}"
    done

    (cd "${WORKDIR}" && sha256sum -c SHA256SUMS)

    install -m 0755 "${WORKDIR}/lisavm-linux-${ARCH}" /usr/local/bin/lisavm
    mkdir -p /var/lib/lisavm/images
    zstd -d -f "${WORKDIR}/rootfs-${ARCH}.ext4.zst" -o /var/lib/lisavm/images/rootfs.ext4
    chmod 0644 /var/lib/lisavm/images/rootfs.ext4

    chmod 0755 "${WORKDIR}/setup-kvm-host.sh" "${WORKDIR}/lisavm-network.sh"
    "${WORKDIR}/setup-kvm-host.sh"

    systemctl daemon-reload
    systemctl enable --now lisavm-network.service lisavm.service
